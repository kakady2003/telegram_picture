[project]
name = "pictur-python-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "kakady2003",email = "kondrin20032808@mail.ru"}
]
requires-python = ">=3.12, <3.15"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.0,<0.53.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "aiogram (>=3.30.0,<4.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "passlib[bcrypt] (==1.7.4)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "bcrypt (==4.0.1)",
    "alembic (>=1.19.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "psycopg (>=3.3.4,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
